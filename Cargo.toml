[package]
name = "rest-api-prj1"
version = "0.1.0"
edition = "2024"

# More keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
axum = "0.8.9"
sqlx = { version = "0.8", features = [ "runtime-tokio-rustls" , "postgres", "time", "uuid"] }
dotenvy = "0.15"
log = "0.4"
pretty_env_logger = "0.5"
async-trait = "0.1"
thiserror = "2.0"
futures-util = "0.3.32"